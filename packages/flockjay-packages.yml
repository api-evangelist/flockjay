findings:
- >-
  Zero SDKs is consistent with the rest of the profile: Flockjay ships an API and an
  MCP server but no developer program around either, so there is nothing to wrap.
- >-
  The MCP server partly substitutes for an SDK for agent consumers — it is the one
  integration path that needs no client library. It does nothing for a developer
  writing conventional code against api.flockjay.com.
