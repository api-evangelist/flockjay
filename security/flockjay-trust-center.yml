findings:
- >-
  The gap between having a Trust Center and being verifiably compliant is the whole
  story here. Flockjay built the page, listed the right control families, and then
  put every answer behind an accordion that does not render server-side and every
  document behind a form.
- >-
  Naming its certifications in plain text on the Trust Center page would be the single
  cheapest credibility improvement available to this company.

