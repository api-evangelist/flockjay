certifications_note: >-
  NONE FOUND. The Trust Center asks "What compliance standards does Flockjay meet?"
  but does not answer it in any publicly readable form, and a full-text scan of both
  the Trust Center and Security page HTML found no occurrence of SOC 2, ISO 27001,
  PCI DSS, HIPAA, FedRAMP or CSA STAR. The only compliance term present anywhere in
  the markup is "CCPA". Flockjay may well hold certifications; it does not publish
  them, and this pipeline does not credit a claim it cannot read.

