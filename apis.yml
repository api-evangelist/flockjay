name: Flockjay
description: >-
  Flockjay is a sales enablement platform that helps revenue teams capture,
  organize, and scale their best practices. It combines a learning management
  system, a content and knowledge management system, and AI-powered coaching —
  including semantic search across sales content, real-time deal and rep
  coaching, call scoring, and pitch grading — so sales leaders, revenue
  operations, and enablement professionals can onboard reps faster and reinforce
  winning behaviors. Flockjay advertises 50+ integrations with tools such as
  Gong, Chorus, Clari Copilot, Slack, Microsoft Teams, Zoom, Salesforce and Okta,
  and is backed by Lightspeed Venture Partners, e.ventures and Salesforce
  Ventures. Flockjay runs a Django REST Framework API at api.flockjay.com whose
  root anonymously enumerates 20 collections across two version trees, and a
  hosted, OAuth 2.1-protected Model Context Protocol server at
  api.flockjay.com/mcp that it announced on its own blog. Neither is documented:
  there is no developer portal, no API reference, no OpenAPI, no SDK and no
  pricing page anywhere on flockjay.com.
