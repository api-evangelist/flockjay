name: Flockjay
description: >-
  Flockjay is a sales enablement platform that helps revenue teams capture,
  organize, and scale their best practices. It combines a learning management
  system, a content and knowledge management system, and AI-powered coaching —
  including semantic search across sales content, real-time deal and rep
  coaching, call scoring, and pitch grading — so sales leaders, revenue
  operations, and enablement professionals can onboard reps faster and reinforce
  winning behaviors. Flockjay advertises 50+ integrations with tools such as
  Slack, Zoom, and common CRMs. The company is backed by Lightspeed Venture
  Partners. Flockjay does not publish a public developer API or developer portal;
  this API Evangelist profile captures its public web, trust, integration, and
  security surface.
