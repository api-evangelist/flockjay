- name: Flockjay MCP Server
  description: >-
    Hosted, first-party Model Context Protocol server that gives AI assistants
    read access to a customer's enablement data — rep certification and learning
    progress, coaching scorecards and call scores, and shared-content performance.
    Announced by Flockjay as "a first-of-its-kind capability for the enablement
    space". The endpoint answers JSON-RPC over HTTPS and is protected by OAuth 2.1
    authorization-code + PKCE with dynamic client registration; anonymous
    tools/list returns HTTP 401 with an RFC 9728 challenge, so the tool list and
    input schemas are not public.
  humanURL: https://flockjay.com/resources/blog/ai-enablement-mcp-server
  baseURL: https://api.flockjay.com/mcp
