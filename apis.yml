apis:
- name: Flockjay API
  description: >-
    Django REST Framework API behind the Flockjay platform. The API root at
    https://api.flockjay.com/api/ is anonymously readable and enumerates 20
    collections across an unversioned v1 tree (events, questions, course, module,
    submodule, assignment_submissions, assignments, live_sessions, groups,
    rubrics, users) and a /v2/ tree (user, learning-content, progress,
    sharedcontent, event, task, user_certificate, assignment-submission, search).
    Every collection requires a Flockjay-issued token. No OpenAPI, no reference
    documentation and no developer portal is published — the profile below was
    established by probing the host.
  humanURL: https://api.flockjay.com/api/
  baseURL: https://api.flockjay.com/api/
