name: Flockjay rate limits
description: >-
  Flockjay publishes no rate limits and signals none at runtime. Not one
  RateLimit-*, X-RateLimit-* or Retry-After header appeared on any response from the
  API host, and there is no documentation page to read a number from. A client — and
  especially an agent driving the MCP server — has no way to know its budget, no way
  to see it depleting, and no machine-readable instruction for how long to wait after
  a rejection.

