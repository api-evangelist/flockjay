- url: https://flockjay.com/sitemap.xml
  status: 200
  note: No developer, API, or limits documentation page exists to publish limits on.

findings:
- >-
  An honest zero. Undocumented limits are not the same as no limits — DRF throttling
  or an nginx/WAF limit may well be enforced upstream; it is simply invisible to a
  client until it fires.
- >-
  This matters most for the MCP surface. An AI assistant that fans out queries across
  rep progress, scorecards and content analytics has no backoff signal to obey, so its
  only feedback will be an unexplained failure.

